[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picogen2"
version = "0.1.1"
description = "PiCoGen2: End-to-end Piano Cover Generation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Chih-Pin Tan", email = "tanchihpin0517@gmail.com" }
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["music", "piano", "cover", "generation", "deep-learning", "pytorch"]

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "omegaconf>=2.3.0",
    "joblib>=1.3.0",
    "yt-dlp>=2024.0.0",
    "questionary>=2.0.0",
    "termcolor>=2.3.0",
    "transformers>=4.30.0",
    "pyrubberband>=0.3.0",
    "miditoolkit>=1.0.0",
    "piano_transcription_inference>=0.0.5",
    "numpy<2.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "ruff>=0.1.0",
    "mypy>=1.0,<1.5",
    "black>=23.0,<24.0",
    "isort>=5.12,<5.13",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
docs = [
    "Sphinx>=4.3.0,<7.1.0",
    "furo==2023.7.26",
    "myst-parser>=1.0,<2.1",
    "sphinx-copybutton==0.5.2",
    "sphinx-autobuild==2021.3.14",
    "sphinx-autodoc-typehints==1.23.3",
]
# Full dependencies with Windows support (via chenkigba forks)
full = [
    "synctoolbox>=1.3.2",
    "sheetsage @ git+https://github.com/chenkigba/PiCoGen-sheetsage.git",
    "beat_this @ git+https://github.com/chenkigba/beat_this.git",
    "madmom @ git+https://github.com/chenkigba/madmom.git",
    "mpi4py>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/tanchihpin0517/PiCoGen"
Repository = "https://github.com/tanchihpin0517/PiCoGen"
Changelog = "https://github.com/tanchihpin0517/PiCoGen/blob/main/CHANGELOG.md"

[project.scripts]
picogen2 = "picogen2.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["picogen2"]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
index-strategy = "unsafe-best-match"
override-dependencies = [
    "madmom @ git+https://github.com/chenkigba/madmom.git",
    "jukebox @ git+https://github.com/chenkigba/mirtoolkit_jukebox.git@mirtoolkit",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
madmom = { git = "https://github.com/chenkigba/madmom.git" }
jukebox = { git = "https://github.com/chenkigba/mirtoolkit_jukebox.git", branch = "mirtoolkit" }
sheetsage = { git = "https://github.com/chenkigba/PiCoGen-sheetsage.git" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu124"
explicit = true

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pyright]
reportPrivateImportUsage = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
strict_optional = false

[tool.pytest.ini_options]
testpaths = "tests/"
python_classes = ["Test*", "*Test"]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"
